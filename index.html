<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Mario Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game">
    <div class="world">
      <!-- Clouds -->
      <div class="clouds">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
      </div>

      <!-- Questions Block -->
      <div class="question q1">?</div>
      <div class="question q2">?</div>
      <div class="question q3">?</div>

      <!-- briccks block -->
      <div class="brick b1"></div>
      <div class="brick b2"></div>

      <!-- pipe -->
      <img class="pipe" src="assets/pipe.webp" alt="pipe">

      <!-- mushroom -->
      <!-- <img src="assets/mario-mushroom-8-bit.webp" alt=""> -->
    </div>
    <div class="player"></div>
    <div class="ground"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
