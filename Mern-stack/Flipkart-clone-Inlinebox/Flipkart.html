<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart-clone</title>
    <link rel="stylesheet" href="flipkart.css">
</head>

<body>
    <!-- header section -->
    <header class="header">
        <div class="top">
            <div class="logo">Flipkart</div>
            <div class="travel">Travel</div>
            <div class="location">Vadodara,Gujarat</div>
        </div>
        <div class="middle">
           
            <input type="text" placeholder="search for Products,Brand & More">
           
            <span>Login</span>
    
            <span>More</span>
            
            <span>Cart</span>
        </div>
        <div class="bottom">

            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>

            <div class="box"></div>

            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>

        </div>
    </header>

    <!-- HERP SECTION -->
     <section id="hero">
        <div class="image">
            <img src="https://rukminim2.flixcart.com/fk-p-flap/1000/490/image/5714a453ef7a54f6.png?q=80" alt="image1">
        </div>
        <div class="image">
            <img src="https://rukminim1.flixcart.com/fk-p-flap/766/374/image/b6dd09c254ca63d5.jpg?q=20" alt="image2">
        </div>
        <div class="image">
            <img src="https://rukminim1.flixcart.com/fk-p-flap/1600/780/image/6ca4b334af0a098c.png?q=80" alt="image3">
        </div>
     </section>

     <section id="recomendation">
        <div class="items">
            <img src="https://rukminim1.flixcart.com/fk-p-flap/350/470/image/7f5db1bb9faab701.png?q=80">
            <img src="https://rukminim1.flixcart.com/fk-p-flap/350/470/image/6dc7689455f8cfef.png?q=80">
            <img src="https://rukminim1.flixcart.com/fk-p-flap/350/470/image/c8997d4317e976d0.png?q=80">
        </div>
     </section>

     <!-- footer section -->
      <footer class="footer">
        <div class="description">
            <h2>Flipkart</h2>
            <p>Best to place to buy</p>
            </div>
            <div class="about">
            <p>About Us</p>
            <p>Contact us</p>
            <p>Career</p>
            <p>Info</p>
</div>
        <div class="help">
            <h3>Help</h3>
            <p>Payment</p>
            <p>order</p>
            <p>Cancellation</p>
            <p>FAQ</p>
        </div>
      </footer>
</body>

</html>
