<!DOCTYPE html>
<html lang="en">
<head>

    <title>Amazon Structure</title>
    <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;  
            }
        </style>
</head>
<body>
    <div style="width: 100vw; height: 100vh; border:3px  solid purple">
        <div style="width: 100vw; height: 15vh; background-color: rgb(126, 98, 138);">

            <div>

        width: 300px;
        height: 35px;
        border-radius: 5px;
        border: 2px solid black;

    ">

        width: 80px;
        height: 35px;
        border: none;
        background-color: orange;
        border-radius: 5px;

    ">

</div>
            </div>

        </div>

         </div>
